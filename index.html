</style></head><body><div id="root"></div><script>
const KEY="sms_students_v1";
const DEPTS=["Computer Science","Information Technology","Electronics","Mechanical Engineering","Civil Engineering","Electrical Engineering","Artificial Intelligence","Other"];
const YEARS=["1st Year","2nd Year","3rd Year","4th Year"];
const P={users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
plus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
cap:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
menu:'<path d="M3 12h18M3 6h18M3 18h18"/>',
refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>',
mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
hash:'<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
bld:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M8 10h.01M16 10h.01M12 10h.01M8 14h.01M16 14h.01M12 14h.01"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||"").join("")||"ST";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const seed=[
{name:"Aditi Sharma",prn:"25070521280",email:"aditi.sharma@example.com",department:"Computer Science",year:"2nd Year",phone:"9876543210"},
{name:"Rohan Patil",prn:"25070521281",email:"rohan.patil@example.com",department:"Information Technology",year:"3rd Year",phone:"9822012345"},
{name:"Sneha Kulkarni",prn:"25070521282",email:"sneha.k@example.com",department:"Artificial Intelligence",year:"2nd Year",phone:""}
].map((s,i)=>({...s,_id:uid()+i,createdAt:Date.now()-i*1000}));
let all=[];
try{const r=localStorage.getItem(KEY);all=r?JSON.parse(r):seed;}catch{all=seed;}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(all));}catch{}};
let st={search:"",active:"Dashboard",menu:false,modal:false,editId:null,form:null,error:"",notice:""};
const blank=()=>({name:"",prn:"",email:"",department:"Computer Science",year:"2nd Year",phone:""});
const filtered=()=>{const q=st.search.trim().toLowerCase();return all.filter(s=>!q||[s.name,s.prn,s.email].some(v=>v.toLowerCase().includes(q))).sort((a,b)=>b.createdAt-a.createdAt);};
let noticeT;
const notify=m=>{st.notice=m;clearTimeout(noticeT);noticeT=setTimeout(()=>{st.notice="";render();},3500);};
const opt=(arr,v)=>arr.map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("");
function render(){
 const list=filtered();
 const stats={t:list.length,d:new Set(list.map(s=>s.department)).size,y:list.filter(s=>s.year==="2nd Year").length};
 const pad=n=>String(n).padStart(2,"0");
 const rows=list.length===0?`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">${ic("users",24)}</div><strong>${st.search?"No matching students":"No students added yet"}</strong><p>${st.search?"Try a different name, PRN, or email.":"Add your first student to start building your directory."}</p>${st.search?"":`<button class="primary-btn" data-a="add">${ic("plus",16)} Add first student</button>`}</div></td></tr>`
 :list.map((s,i)=>`<tr><td><div class="student-cell"><div class="student-avatar avatar-${i%5}">${esc(initials(s.name))}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.email)}</small></div></div></td><td><span class="prn">${esc(s.prn)}</span></td><td><span class="department-pill">${esc(s.department)}</span></td><td><span class="year-pill">${esc(s.year)}</span></td><td><div class="contact-cell">${s.phone?ic("phone",13)+" "+esc(s.phone):ic("mail",13)+" "+esc(s.email)}</div></td><td><div class="row-actions"><button class="action-btn edit" data-a="edit" data-id="${s._id}" aria-label="Edit ${esc(s.name)}" title="Edit student">${ic("edit",15)}</button><button class="action-btn delete" data-a="del" data-id="${s._id}" aria-label="Delete ${esc(s.name)}" title="Delete student">${ic("trash",15)}</button></div></td></tr>`).join("");
 const nav=[["Dashboard","dash"],["Students","users"]].map(([l,i])=>`<button class="nav-item ${st.active===l?"active":""}" data-a="nav" data-id="${l}">${ic(i)}<span>${l}</span>${l==="Students"?`<span class="nav-count">${all.length}</span>`:""}</button>`).join("");
 const f=st.form;
 const modal=st.modal?`<div class="modal-backdrop" data-a="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal-heading"><div><div class="eyebrow">${st.editId?"UPDATE RECORD":"NEW RECORD"}</div><h2 id="mt">${st.editId?"Edit student":"Add a student"}</h2><p>Enter the student’s details below.</p></div><button class="icon-btn" data-a="close" aria-label="Close form">${ic("x",19)}</button></div>${st.error?`<div class="form-error">${esc(st.error)}</div>`:""}<form id="sf" novalidate>
 <label>Full name <span>*</span><div class="input-wrap">${ic("users",16)}<input name="name" maxlength="80" value="${esc(f.name)}" placeholder="e.g. Aditi Sharma"></div></label>
 <div class="form-row"><label>PRN / Student ID <span>*</span><div class="input-wrap">${ic("hash",16)}<input name="prn" maxlength="40" value="${esc(f.prn)}" placeholder="e.g. 25070521280"></div></label><label>Phone number<div class="input-wrap">${ic("phone",16)}<input name="phone" type="tel" maxlength="20" value="${esc(f.phone)}" placeholder="Optional"></div></label></div>
 <label>Email address <span>*</span><div class="input-wrap">${ic("mail",16)}<input name="email" type="email" value="${esc(f.email)}" placeholder="student@example.com"></div></label>
 <div class="form-row"><label>Department <span>*</span><div class="input-wrap">${ic("bld",16)}<select name="department">${opt(DEPTS,f.department)}</select></div></label><label>Academic year <span>*</span><div class="input-wrap">${ic("cap",16)}<select name="year">${opt(YEARS,f.year)}</select></div></label></div>
 <div class="modal-actions"><button type="button" class="outline-btn" data-a="close">Cancel</button><button type="submit" class="primary-btn">${st.editId?"Save changes":ic("plus",16)+" Add student"}</button></div></form></section></div>`:"";
 const focus=document.activeElement;const keep=focus&&focus.id==="q"?focus.selectionStart:null;
 document.getElementById("root").innerHTML=`<div class="app-shell"><aside class="sidebar ${st.menu?"sidebar-open":""}"><div class="brand"><div class="brand-mark">${ic("cap",25)}</div><div><strong>Campus<span>Flow</span></strong><small>STUDENT PORTAL</small></div><button class="icon-btn mobile-close" data-a="menu0" aria-label="Close menu">${ic("x")}</button></div><div class="nav-caption">WORKSPACE</div><nav>${nav}<button class="nav-item" data-a="add">${ic("plus")}<span>Add Student</span></button></nav><div class="sidebar-bottom"><div class="sidebar-tip"><div class="tip-icon">${ic("book")}</div><strong>Keep records organized</strong><p>Manage your student directory from one simple workspace.</p></div><div class="profile"><div class="profile-avatar">F</div><div><strong>FLEXI Project</strong><small>Administrator</small></div><span class="online-dot"></span></div></div></aside>${st.menu?`<button class="scrim" data-a="menu0" aria-label="Close navigation"></button>`:""}
 <main class="main-area"><header class="topbar"><button class="icon-btn mobile-menu-btn" data-a="menu1" aria-label="Open menu">${ic("menu",21)}</button><div class="breadcrumb">Workspace <span>/</span> <strong>${st.active}</strong></div><div class="topbar-right"><span class="status-dot"></span> System dashboard <div class="top-avatar">F</div></div></header><div class="content">
 <section class="welcome-row"><div><div class="eyebrow">OVERVIEW</div><h1>${st.active==="Students"?"Student Directory":"Student Dashboard"}<span>.</span></h1><p>Manage student information, all in one place.</p></div><button class="primary-btn" data-a="add">${ic("plus",17)} Add student</button></section>
 ${st.notice?`<div class="toast"><span>✓</span>${esc(st.notice)}<button data-a="toast" aria-label="Dismiss">${ic("x",16)}</button></div>`:""}
 <section class="stats-grid"><article class="stat-card"><div class="stat-top"><span>Total students</span><div class="stat-icon violet">${ic("users",19)}</div></div><div class="stat-number">${pad(stats.t)}</div><div class="stat-foot"><span class="mini-dot violet-dot"></span> Records matching your search</div></article><article class="stat-card"><div class="stat-top"><span>Departments</span><div class="stat-icon blue">${ic("bld",19)}</div></div><div class="stat-number">${pad(stats.d)}</div><div class="stat-foot">Across listed students</div></article><article class="stat-card"><div class="stat-top"><span>Second-year students</span><div class="stat-icon green">${ic("cap",20)}</div></div><div class="stat-number">${pad(stats.y)}</div><div class="stat-foot">Based on year field</div></article></section>
 <section class="directory-card"><div class="directory-heading"><div><h2>All students</h2><p>Student records saved in this browser</p></div><button class="outline-btn" data-a="refresh">${ic("refresh",15)} Refresh</button></div><div class="toolbar"><div class="search-box">${ic("search",17)}<input id="q" value="${esc(st.search)}" placeholder="Search by name, PRN or email..." aria-label="Search students">${st.search?`<button data-a="clear" aria-label="Clear search">${ic("x",15)}</button>`:""}</div><span class="result-count">${list.length} ${list.length===1?"record":"records"}</span></div><div class="table-wrap"><table><thead><tr><th>STUDENT</th><th>PRN / ID</th><th>DEPARTMENT</th><th>YEAR</th><th>CONTACT</th><th class="actions-heading">ACTIONS</th></tr></thead><tbody>${rows}</tbody></table></div><div class="table-footer"><span>Demo mode: data stays in your browser</span><span><span class="live-dot"></span> Saved locally</span></div></section>
 <footer class="footer"><span>© 2026 CampusFlow · FLEXI Project</span><span>Built with React · Node.js · MongoDB</span></footer></div></main>${modal}</div>`;
 if(keep!==null){const q=document.getElementById("q");q.focus();q.setSelectionRange(keep,keep);}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==="backdrop"&&e.target!==b)return;
 if(a==="nav"){st.active=id;st.menu=false;}
 else if(a==="add"){st.editId=null;st.form=blank();st.error="";st.modal=true;st.menu=false;}
 else if(a==="edit"){const s=all.find(x=>x._id===id);st.editId=id;st.form={...blank(),...s};st.error="";st.modal=true;}
 else if(a==="del"){const s=all.find(x=>x._id===id);if(!confirm(`Delete ${s.name}’s record? This cannot be undone.`))return;all=all.filter(x=>x._id!==id);save();notify("Student record deleted.");}
 else if(a==="close"||a==="backdrop")st.modal=false;
 else if(a==="menu0")st.menu=false;else if(a==="menu1")st.menu=true;
 else if(a==="toast")st.notice="";
 else if(a==="clear")st.search="";
 render();
});
document.addEventListener("input",e=>{if(e.target.id==="q"){st.search=e.target.value;render();}});
document.addEventListener("submit",e=>{
 e.preventDefault();
 const d=Object.fromEntries(new FormData(e.target));
 Object.keys(d).forEach(k=>d[k]=d[k].trim());
 st.form=d;
 if(d.name.length<2)st.error="Name is required (at least 2 characters).";
 else if(!d.prn)st.error="PRN is required.";
 else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))st.error="Enter a valid email address.";
 else if(all.some(s=>s._id!==st.editId&&s.prn===d.prn))st.error="A student with this PRN already exists.";
 else if(all.some(s=>s._id!==st.editId&&s.email.toLowerCase()===d.email.toLowerCase()))st.error="A student with this email already exists.";
 else{
  st.error="";d.email=d.email.toLowerCase();
  if(st.editId){all=all.map(s=>s._id===st.editId?{...s,...d}:s);notify("Student details updated successfully.");}
  else{all.push({...d,_id:uid(),createdAt:Date.now()});notify("Student added successfully.");}
  save();st.modal=false;
 }
 render();
});
render();
</script></body></html>
